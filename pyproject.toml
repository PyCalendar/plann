[project]
name = "plann"
dynamic = ["version"]
description = "Simple command-line CalDAV client and planning tool, for adding and browsing calendar items, todo list items, etc."
authors = [{ name = "Tobias Brox", email = "t-plann@tobixen.no" }]
maintainers = [{ name = "Tobias Brox", email = "t-plann@tobixen.no" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE.TXT"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
keywords = ["caldav", "calendar", "cli", "todo", "planning"]
dependencies = [
    "caldav>=3.6.0",
    "calendaring-config>=0.4",
    "Click",
    "PyYAML",
    "sortedcontainers",
    "dateparser>=1.2",
    "python-dateutil",
    "icalendar>=6.2.0",
    "icalendar_searcher",
]

[project.urls]
Homepage = "https://plann.no"
Repository = "https://github.com/pycalendar/plann"
Documentation = "https://plann.no"

[project.scripts]
plann = "plann.cli:cli"

[project.optional-dependencies]
dev = [
    "niquests",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "xandikos",
    "deptry>=0.24.0",
    # a build backend, not a runtime dep - here so the tests can import and
    # exercise hatch_build.py's completion hook
    "hatchling",
]

[build-system]
# click is a runtime dependency too, but the build needs it as well:
# hatch_build.py generates the shell completion files from it (see that file).
requires = ["hatchling", "hatch-vcs", "click"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "plann/_version.py"

# hatch_build.py: generates the bash/zsh/fish completion files into the wheel's
# shared-data, so tab-completion works with no shell rc editing.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["plann"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (many existing long lines)
]

[tool.ruff.lint.isort]
known-first-party = ["plann"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["plann"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.deptry]
pep621_dev_dependency_groups = ["dev"]
## build hook, runs under the build backend - not part of the package
extend_exclude = ['hatch_build\.py']

[tool.deptry.per_rule_ignores]
## PyYAML is no longer imported directly, but it's still needed for yaml
## config files - the caldav library imports it lazily without declaring it
DEP002 = ["PyYAML"]
